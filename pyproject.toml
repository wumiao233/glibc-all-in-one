[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glibc-aio"
version = "2.0.0"
description = "All-in-one glibc analysis toolkit — download, analyze, identify, diff, vuln, and build"
license = {text = "Personal/Educational Use Only — No Commercial Use"}
requires-python = ">=3.10"
dependencies = [
    "pyelftools",
    "zstandard",
]

[project.scripts]
glibc-aio = "glibc_aio.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.glibc-aio]
libs_dir = "libs"
debs_dir = "debs"
keep_debs = false
default_mirror = "auto"
dbg = true
docker_image = "auto"
offline = false
